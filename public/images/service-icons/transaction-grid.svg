<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Central hub -->
  <circle cx="40" cy="40" r="9" fill="#e5f4e5" stroke="#4ca049" stroke-width="2"/>
  <!-- Outer nodes -->
  <circle cx="14" cy="20" r="7" fill="#fff8e7" stroke="#c8b68a" stroke-width="1.5"/>
  <circle cx="66" cy="20" r="7" fill="#fff8e7" stroke="#c8b68a" stroke-width="1.5"/>
  <circle cx="14" cy="60" r="7" fill="#fff8e7" stroke="#c8b68a" stroke-width="1.5"/>
  <circle cx="66" cy="60" r="7" fill="#fff8e7" stroke="#c8b68a" stroke-width="1.5"/>
  <!-- Connecting lines with arrows (bidirectional) -->
  <!-- top-left to center -->
  <line x1="20" y1="24" x2="33" y2="34" stroke="#4ca049" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="33,34 27,33 30,28" fill="#4ca049"/>
  <!-- top-right to center -->
  <line x1="60" y1="24" x2="47" y2="34" stroke="#4ca049" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="47,34 53,28 50,33" fill="#4ca049"/>
  <!-- bottom-left to center -->
  <line x1="20" y1="56" x2="33" y2="46" stroke="#a87420" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="33,46 27,47 30,52" fill="#a87420"/>
  <!-- bottom-right to center -->
  <line x1="60" y1="56" x2="47" y2="46" stroke="#a87420" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="47,46 53,52 50,47" fill="#a87420"/>
  <!-- center dot -->
  <circle cx="40" cy="40" r="3" fill="#27421d"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Screen / monitor -->
  <rect x="8" y="10" width="64" height="44" rx="4" fill="#27421d"/>
  <rect x="12" y="14" width="56" height="36" rx="2" fill="#1f3318"/>
  <!-- Video feed — presenter -->
  <rect x="15" y="17" width="34" height="24" rx="2" fill="#3a5c2e"/>
  <circle cx="32" cy="25" r="5" fill="#4ca049" opacity="0.8"/>
  <path d="M22 41 Q32 35 42 41" fill="#4ca049" opacity="0.6"/>
  <!-- Small participant tiles -->
  <rect x="52" y="17" width="13" height="10" rx="1.5" fill="#3a5c2e"/>
  <circle cx="58.5" cy="21" r="2.5" fill="#6b8e23" opacity="0.7"/>
  <rect x="52" y="30" width="13" height="10" rx="1.5" fill="#3a5c2e"/>
  <circle cx="58.5" cy="34" r="2.5" fill="#6b8e23" opacity="0.7"/>
  <!-- Live badge -->
  <rect x="16" y="18" width="18" height="7" rx="2" fill="#b8552a"/>
